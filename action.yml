name: 'Safely Swap Azure App Service & Function App Slot'
description: 'Safely swap deployment slots for Azure App Service and Azure Function App with slot-setting protection and review workflow'
author: 'Thada'
inputs:
  mode:
    required: true
    description: 'Operation mode: get-deploy-slots, create-swap-plan, set-deploy-slots, swap-slots, or clean'
  config:
    required: false
    description: 'JSON configuration for the swap action. Supports an optional resourceType field accepting "webapp" (default) or "functionapp" to control which Azure CLI commands are used and enable Function App-specific warnings.'
  token:
    required: false
    description: 'personal access token'
  repo: 
    required: false
    description: 'repo'
  ref: 
    required: false
    description: 'ref'
    default: 'appsettings'
  path:
    required: false
    description: 'path to place app setting'
    default: '.'

runs:
  using: 'node16'
  main: 'dist/index.js'
